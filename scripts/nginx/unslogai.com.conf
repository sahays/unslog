# Reverse proxy for unslog → 127.0.0.1:__APP_PORT__
# Rendered by scripts/deploy.sh; __APP_PORT__ is substituted at install time.
#
# TLS is intentionally omitted from this template — run `certbot --nginx -d unslogai.com -d www.unslogai.com`
# after the first successful HTTP-only deploy. Certbot will rewrite this file
# in place to add the 443 server block and the HTTP→HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name unslogai.com www.unslogai.com;

    # ACME http-01 challenge (let certbot write here).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Match the 50 MB body cap the Axum app accepts (audio + book PDFs).
    client_max_body_size 50m;

    # Reasonable timeouts for STT / TTS / critique round-trips.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Logs scoped to this vhost.
    access_log /var/log/nginx/unslogai.access.log;
    error_log  /var/log/nginx/unslogai.error.log warn;

    location / {
        proxy_pass         http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # HTMX uses chunked responses; disable nginx buffering.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
