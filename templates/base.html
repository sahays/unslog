<!doctype html>
<html lang="en"
      class="h-full"
      x-data="{ darkMode: localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches) }"
      x-init="$watch('darkMode', v => localStorage.setItem('theme', v ? 'dark' : 'light'))"
      :class="{ 'dark': darkMode }">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}unslog{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Lexend:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/static/css/app.css" />
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="https://unpkg.com/alpinejs@3.14.1" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/static/js/nselect.js" defer></script>
    <script src="/static/js/recorder.js" defer></script>
    {% block head %}{% endblock %}
  </head>
  <body class="bg-accent-gradient antialiased min-h-screen">

    <!-- Top progress bar (HTMX-driven) -->
    <div id="progress-bar" class="progress-bar"></div>

    <!-- Navigation -->
    <nav class="nav-frosted sticky top-0 z-[var(--z-sticky)]">
      <div class="mx-auto max-w-5xl px-6 sm:px-8 lg:px-12">
        <div class="flex h-14 items-center justify-between">
          <a href="/" class="flex items-center gap-2 font-heading text-lg font-semibold text-[color:var(--color-accent)]">
            <i data-lucide="layers" class="h-5 w-5"></i>
            unslog
          </a>

          <div class="flex items-center gap-5 text-sm">
            <a href="/companies" class="nav-link inline-flex items-center gap-1.5">
              <i data-lucide="briefcase" class="h-4 w-4"></i>
              <span>Companies</span>
            </a>
            <a href="/assets" class="nav-link inline-flex items-center gap-1.5">
              <i data-lucide="book-open" class="h-4 w-4"></i>
              <span>Assets</span>
            </a>
            <a href="/prompts" class="nav-link inline-flex items-center gap-1.5">
              <i data-lucide="file-text" class="h-4 w-4"></i>
              <span>Prompts</span>
            </a>
            <a href="/settings" class="nav-link inline-flex items-center gap-1.5">
              <i data-lucide="sliders" class="h-4 w-4"></i>
              <span>Settings</span>
            </a>

            <button
              @click="darkMode = !darkMode"
              class="btn btn-ghost p-2"
              :aria-label="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
              title="Toggle theme">
              <i x-show="!darkMode" x-cloak data-lucide="moon" class="h-4 w-4"></i>
              <i x-show="darkMode" x-cloak data-lucide="sun" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="mx-auto max-w-5xl px-6 sm:px-8 lg:px-12 py-8">
      {% block content %}{% endblock %}
    </main>

    <!-- Lucide loader, YouTube-style progress bar, and submit-in-flight feedback -->
    <script>
      (function () {
        /* ── Lucide ──────────────────────────────────────────── */
        function renderIcons() {
          if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', renderIcons);
        } else {
          renderIcons();
        }
        document.body.addEventListener('htmx:afterSwap', renderIcons);
        document.body.addEventListener('htmx:load', renderIcons);

        /* ── YouTube-style progress bar ──────────────────────── */
        var bar = document.getElementById('progress-bar');
        var inFlight = false;
        function startProgress() {
          if (!bar || inFlight) return;
          inFlight = true;
          bar.style.transition = 'none';
          bar.style.width = '0%';
          bar.style.opacity = '1';
          /* force reflow so the next transition takes effect */
          void bar.offsetWidth;
          bar.style.transition = 'width 8s cubic-bezier(0.05, 0.55, 0.4, 0.95)';
          bar.style.width = '85%';
        }
        function finishProgress() {
          if (!bar) return;
          inFlight = false;
          bar.style.transition = 'width 220ms ease-out, opacity 360ms ease-out 160ms';
          bar.style.width = '100%';
          window.setTimeout(function () { bar.style.opacity = '0'; }, 240);
          window.setTimeout(function () {
            bar.style.transition = 'none';
            bar.style.width = '0%';
          }, 740);
        }

        /* Same-tab link click → start */
        document.addEventListener('click', function (e) {
          var a = e.target.closest('a[href]');
          if (!a) return;
          if (a.target && a.target !== '_self') return;
          if (a.hasAttribute('download')) return;
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
          var url;
          try { url = new URL(a.href, window.location.href); } catch (_) { return; }
          if (url.origin !== window.location.origin) return;
          /* same-page anchor jump → no nav, skip */
          if (url.pathname === window.location.pathname && url.search === window.location.search && url.hash) return;
          startProgress();
        }, true);

        /* Plain form submit → start */
        document.addEventListener('submit', function (e) {
          var form = e.target;
          if (!(form instanceof HTMLFormElement)) return;
          if (form.target && form.target !== '_self') return;
          startProgress();
          /* Submit-in-flight button feedback: spin the icon, dim the button
             while the next page loads. FormData is already collected at this
             point, so flipping disabled is safe. */
          if (form.dataset.noLoading !== 'true') {
            var btn = form.querySelector('button[type="submit"], input[type="submit"]');
            if (btn) {
              btn.classList.add('btn-loading');
              btn.setAttribute('aria-busy', 'true');
            }
          }
        }, true);

        /* htmx requests */
        document.body.addEventListener('htmx:beforeRequest', startProgress);
        document.body.addEventListener('htmx:afterRequest', finishProgress);

        /* Page loaded (initial nav or bfcache restore) → finish */
        window.addEventListener('pageshow', finishProgress);
      })();
    </script>
  </body>
</html>
