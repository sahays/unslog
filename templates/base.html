<!doctype html>
<html lang="en"
      class="h-full"
      x-data="{ darkMode: localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches) }"
      x-init="$watch('darkMode', v => localStorage.setItem('theme', v ? 'dark' : 'light'))"
      :class="{ 'dark': darkMode }">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}unslog{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Lexend:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/static/css/app.css" />
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="https://unpkg.com/alpinejs@3.14.1" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/static/js/nselect.js" defer></script>
    <script src="/static/js/recorder.js" defer></script>
    {% block head %}{% endblock %}
  </head>
  <body class="bg-accent-gradient antialiased min-h-screen"
        x-data="{ navOpen: false }"
        @keydown.escape.window="navOpen = false">

    <!-- Top progress bar (HTMX-driven) -->
    <div id="progress-bar" class="progress-bar"></div>

    <div class="app-shell">

      <!-- ── Sidebar (fixed-drawer on mobile, sticky on lg+) ─────────── -->
      <aside class="app-sidebar"
             :class="navOpen && 'open'"
             aria-label="Primary navigation">
        <div class="app-sidebar__brand">
          <a href="/" class="brand-link" @click="navOpen = false">
            <i data-lucide="layers" class="h-5 w-5"></i>
            <span>unslog</span>
          </a>
        </div>
        <nav class="app-sidebar__nav">
          <a href="/companies" class="nav-link-side" data-nav-key="companies" @click="navOpen = false">
            <i data-lucide="briefcase" class="h-4 w-4"></i>
            <span>Companies</span>
          </a>
          <a href="/practice" class="nav-link-side" data-nav-key="practice" @click="navOpen = false">
            <i data-lucide="target" class="h-4 w-4"></i>
            <span>Practice</span>
          </a>
          <a href="/stories" class="nav-link-side" data-nav-key="stories" @click="navOpen = false">
            <i data-lucide="book-marked" class="h-4 w-4"></i>
            <span>Stories</span>
          </a>
          <a href="/assets" class="nav-link-side" data-nav-key="assets" @click="navOpen = false">
            <i data-lucide="book-open" class="h-4 w-4"></i>
            <span>Assets</span>
          </a>
          <a href="/prompts" class="nav-link-side" data-nav-key="prompts" @click="navOpen = false">
            <i data-lucide="file-text" class="h-4 w-4"></i>
            <span>Prompts</span>
          </a>
          <a href="/settings" class="nav-link-side" data-nav-key="settings" @click="navOpen = false">
            <i data-lucide="sliders" class="h-4 w-4"></i>
            <span>Settings</span>
          </a>
        </nav>
      </aside>

      <!-- Mobile drawer backdrop (only visible while drawer is open on small screens) -->
      <div class="app-drawer-backdrop"
           x-show="navOpen"
           x-cloak
           @click="navOpen = false"
           x-transition.opacity></div>

      <!-- ── Main column: top bar + page content ─────────────────────── -->
      <div class="app-main">
        <header class="app-topbar">
          <button type="button"
                  class="app-hamburger"
                  @click="navOpen = !navOpen"
                  :aria-expanded="navOpen"
                  aria-label="Toggle navigation">
            <i data-lucide="menu" class="h-4 w-4"></i>
          </button>

          <nav class="app-breadcrumbs" aria-label="Breadcrumb">
            {% block breadcrumbs %}{% endblock %}
          </nav>

          <button type="button"
                  class="theme-toggle"
                  @click="darkMode = !darkMode"
                  :aria-label="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
                  title="Toggle theme">
            <i x-show="!darkMode" x-cloak data-lucide="moon" class="h-4 w-4"></i>
            <i x-show="darkMode" x-cloak data-lucide="sun" class="h-4 w-4"></i>
          </button>
        </header>

        <main class="app-content">
          {% block content %}{% endblock %}
        </main>
      </div>

      <!-- ── Right rail (xl+ only) ───────────────────────────────────── -->
      <aside class="app-rail" aria-label="Page context">
        {% block rail %}
          <div class="rail-empty">
            <p class="muted-soft text-xs m-0">Context for this view will appear here as you use the app.</p>
          </div>
        {% endblock %}
      </aside>

    </div>

    <!-- App overlay: shown while a long form (answer, end-session, research) is in flight -->
    <div id="app-overlay" class="app-overlay" aria-hidden="true">
      <div class="app-overlay__card" role="alertdialog" aria-busy="true" aria-live="polite">
        <div class="app-overlay__spinner"></div>
        <div class="app-overlay__title" id="app-overlay-title">Working…</div>
        <div class="app-overlay__detail" id="app-overlay-detail"></div>
        <div class="app-overlay__shimmer"></div>
      </div>
    </div>

    <!-- Lucide loader, YouTube-style progress bar, and submit-in-flight feedback -->
    <script>
      (function () {
        /* ── Lucide ──────────────────────────────────────────── */
        function renderIcons() {
          if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', renderIcons);
        } else {
          renderIcons();
        }
        document.body.addEventListener('htmx:afterSwap', renderIcons);
        document.body.addEventListener('htmx:load', renderIcons);

        /* ── Sidebar active-route highlight (URL-based fallback until
             SSR nav_active is wired in Phase 3). Matches the longest
             data-nav-key prefix against the current pathname. */
        function markActiveNav() {
          var path = window.location.pathname;
          var links = document.querySelectorAll('.nav-link-side[data-nav-key]');
          var best = null;
          var bestLen = -1;
          links.forEach(function (a) {
            try {
              var href = new URL(a.getAttribute('href'), window.location.origin).pathname;
              if (path === href || path.startsWith(href + '/')) {
                if (href.length > bestLen) { best = a; bestLen = href.length; }
              }
            } catch (_) {}
            a.classList.remove('active');
          });
          if (best) best.classList.add('active');
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', markActiveNav);
        } else {
          markActiveNav();
        }

        /* ── YouTube-style progress bar ──────────────────────── */
        var bar = document.getElementById('progress-bar');
        var inFlight = false;
        function startProgress() {
          if (!bar || inFlight) return;
          inFlight = true;
          bar.style.transition = 'none';
          bar.style.width = '0%';
          bar.style.opacity = '1';
          /* force reflow so the next transition takes effect */
          void bar.offsetWidth;
          bar.style.transition = 'width 8s cubic-bezier(0.05, 0.55, 0.4, 0.95)';
          bar.style.width = '85%';
        }
        function finishProgress() {
          if (!bar) return;
          inFlight = false;
          bar.style.transition = 'width 220ms ease-out, opacity 360ms ease-out 160ms';
          bar.style.width = '100%';
          window.setTimeout(function () { bar.style.opacity = '0'; }, 240);
          window.setTimeout(function () {
            bar.style.transition = 'none';
            bar.style.width = '0%';
          }, 740);
        }

        /* Same-tab link click → start */
        document.addEventListener('click', function (e) {
          var a = e.target.closest('a[href]');
          if (!a) return;
          if (a.target && a.target !== '_self') return;
          if (a.hasAttribute('download')) return;
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
          var url;
          try { url = new URL(a.href, window.location.href); } catch (_) { return; }
          if (url.origin !== window.location.origin) return;
          /* same-page anchor jump → no nav, skip */
          if (url.pathname === window.location.pathname && url.search === window.location.search && url.hash) return;
          startProgress();
        }, true);

        /* ── Modal overlay (long form submits) ──────────────── */
        var overlay = document.getElementById('app-overlay');
        var overlayTitle = document.getElementById('app-overlay-title');
        var overlayDetail = document.getElementById('app-overlay-detail');
        function showOverlay(title, detailHTML) {
          if (!overlay) return;
          if (overlayTitle) overlayTitle.textContent = title || 'Working…';
          if (overlayDetail) overlayDetail.innerHTML = detailHTML || '';
          overlay.classList.add('visible');
          overlay.setAttribute('aria-hidden', 'false');
        }
        function hideOverlay() {
          if (!overlay) return;
          overlay.classList.remove('visible');
          overlay.setAttribute('aria-hidden', 'true');
        }

        /* Plain form submit → start */
        document.addEventListener('submit', function (e) {
          var form = e.target;
          if (!(form instanceof HTMLFormElement)) return;
          if (form.target && form.target !== '_self') return;
          startProgress();
          /* Submit-in-flight button feedback: spin the icon, dim the button
             while the next page loads. FormData is already collected at this
             point, so flipping disabled is safe. */
          if (form.dataset.noLoading !== 'true') {
            var btn = form.querySelector('button[type="submit"], input[type="submit"]');
            if (btn) {
              btn.classList.add('btn-loading');
              btn.setAttribute('aria-busy', 'true');
            }
          }
          /* Long-running form? Show modal overlay with operation-specific copy. */
          if (form.dataset.loadingTitle || form.dataset.loadingDetail) {
            showOverlay(
              form.dataset.loadingTitle || 'Working…',
              form.dataset.loadingDetail || ''
            );
          }
        }, true);

        /* htmx requests */
        document.body.addEventListener('htmx:beforeRequest', startProgress);
        document.body.addEventListener('htmx:afterRequest', finishProgress);

        /* Page loaded (initial nav or bfcache restore) → finish + clear overlay */
        window.addEventListener('pageshow', function () {
          finishProgress();
          hideOverlay();
        });
      })();
    </script>
  </body>
</html>
