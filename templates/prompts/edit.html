{% extends "base.html" %}

{% block title %}{{ name }} — prompts{% endblock %}

{% block content %}
<div style="display: grid; gap: 1rem;">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div>
      <h2 style="margin: 0; font-size: 1.125rem; font-weight: 600;">{{ name }}</h2>
      <div class="muted" style="font-size: 0.875rem;">{{ description }}</div>
      <div class="muted" style="font-size: 0.75rem; margin-top: 0.25rem;">
        Current version: <code>{{ current_version_id }}</code> • updated {{ updated_at }}
      </div>
    </div>
    <div style="display: flex; gap: 0.375rem;">
      <a class="btn" href="/prompts">Back</a>
      <a class="btn" href="/prompts/{{ name }}/history">History</a>
    </div>
  </div>

  <form method="post" action="/prompts/{{ name }}" style="display: grid; gap: 0.75rem;">
    <textarea name="body" style="min-height: 60vh;" spellcheck="false">{{ body }}</textarea>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <button type="submit" class="btn btn-primary">Save as new version</button>
      <span class="muted" style="font-size: 0.8125rem;">Saving creates a new version — your earlier text stays in history.</span>
    </div>
  </form>
</div>
{% endblock %}
