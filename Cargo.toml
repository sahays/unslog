[package]
name = "unslog"
version = "0.5.0"
edition = "2021"
# Adding `src/bin/eval.rs` made `cargo run` ambiguous; pin the default so
# `cargo watch -x run` keeps starting the web server.
default-run = "unslog"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header", "form", "multipart", "cookie"] }
axum-htmx = "0.6"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "limit"] }
http = "1.0"

# Templates
askama = { version = "0.12", features = ["serde-json"] }
askama_axum = "0.4"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Already transitive via axum-extra's form feature; declaring it directly so
# csrf_verify middleware can parse `csrf_token` out of an x-www-form-urlencoded
# body without pulling a new crate.
serde_urlencoded = "0.7"

# Database — Postgres via sqlx is the live store.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "json", "migrate", "ipnetwork"] }

# Errors
anyhow = "1.0"
thiserror = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
futures = "0.3"
async-trait = "0.1"

# PDF extraction (with pdftotext as a runtime fallback)
pdf-extract = "0.7"

# Multipart helpers
bytes = "1"

# Base64 (for STT input_audio)
base64 = "0.22"

# Random shuffle + CSPRNG (OsRng) for invite codes, salts, server keys.
rand = "0.8"

# Auth primitives (Phase 1+). `argon2` for invite-code hashing, `hmac` +
# `sha2` + `subtle` for the cookie / CSRF MACs. All audited, std-shaped
# crates; no rolling our own.
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"

# CLI argument parsing — used by src/bin/eval.rs.
clap = { version = "4", features = ["derive"] }

# Markdown rendering + HTML sanitization (LLM output is rendered as markdown
# but treated as untrusted — strip raw HTML, then ammonia-clean the result).
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }
ammonia = "4"

[dev-dependencies]
# Auto-generated mocks for trait-based DB and LLM seams.
mockall = "0.12"
# tempdir helper for tests that need a real filesystem path.
tempfile = "3"
# Source-grep for the metering route-coverage test — walks src/routes/
# and asserts every endpoint has a billing decision.
regex = "1"
